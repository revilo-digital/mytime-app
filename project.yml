name: MyTime
options:
  bundleIdPrefix: nz.olly
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  MyTime:
    type: application
    platform: macOS
    sources: [MyTime]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: MyTime/Resources/Info.plist
      properties:
        CFBundleDisplayName: MyTime
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "MyTime opens a draft in Mail from your chosen address with the invoice PDF attached."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.olly.MyTime
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  MyTimeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MyTimeTests]
    dependencies:
      - target: MyTime
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyTime.app/Contents/MacOS/MyTime"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MyTime:
    build:
      targets:
        MyTime: all
        MyTimeTests: [test]
    test:
      targets: [MyTimeTests]
